<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ungroup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root { --ground:#1b1928; --panel:#242236; --panel-2:#2c2a40; --rule:#3a3852; --ink:#ece9f5; --ink-2:#b9b5cc; --muted:#7f7b98; --accent:#9fe0f6; --void:#14121f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; font-size:14px; line-height:1.45; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 320px; grid-template-rows:auto minmax(0,1fr); gap:14px; height:100vh; padding:14px; }
  @media (max-width:900px) { .app { grid-template-columns:1fr; grid-template-rows:auto auto auto; height:auto; } }
  header { grid-column:1/-1; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-family:"Chakra Petch",sans-serif; font-size:22px; font-weight:700; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--muted); font-weight:500; }
  .meta { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .stage { position:relative; background:var(--void); border:1px solid var(--rule); border-radius:6px; min-height:0; display:flex; flex-direction:column; }
  .stage canvas { display:block; width:100%; flex:1; min-height:0; }
  .banner { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); background:rgba(27,25,40,.92); border:1px solid var(--rule); border-radius:8px; padding:18px 26px; font-family:"Chakra Petch",sans-serif; font-size:22px; text-align:center; }
  .banner small { display:block; font-family:"IBM Plex Sans",sans-serif; font-size:13px; color:var(--ink-2); margin-top:6px; }
  aside { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:10px 12px; min-height:0; }
  .card h2 { font-family:"Chakra Petch",sans-serif; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .players { display:grid; gap:8px; } .card.plist { overflow-y:auto; max-height:46vh; flex-shrink:0; }
  .player { display:grid; grid-template-columns:14px 1fr auto; grid-template-rows:auto auto; column-gap:8px; row-gap:4px; align-items:center; padding:6px 8px; border-radius:4px; background:var(--panel-2); border-left:3px solid transparent; }
  .player.me { border-left-color:var(--accent); }
  .player .sw { width:14px; height:14px; border-radius:50%; grid-row:1/3; }
  .player .name { font-family:"Chakra Petch",sans-serif; font-weight:600; font-size:13px; }
  .player .state { font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); text-align:right; white-space:nowrap; }
  .player .bars { grid-column:2/4; display:flex; gap:4px; }
  .bar { flex:1; height:9px; background:#1a1826; border-radius:2px; position:relative; overflow:hidden; }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; } .bar .carry { position:absolute; top:0; bottom:0; opacity:.45; }
  .player .nums { grid-column:2/4; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); display:flex; gap:4px; }
  .player .nums span { flex:1; font-variant-numeric:tabular-nums; }
  .feed { flex:1; overflow-y:auto; min-height:100px; }
  .feed ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
  .feed li { font-size:12px; display:grid; grid-template-columns:44px 1fr; gap:8px; color:var(--ink-2); }
  .feed li .t { font-family:"IBM Plex Mono",monospace; color:var(--muted); }
  .feed li.big { color:var(--ink); font-weight:600; }
  .tag { display:inline-block; padding:0 5px; border-radius:3px; font-family:"Chakra Petch",sans-serif; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-right:4px; }
  .tag.merge{background:#2c4a5c;color:var(--accent)} .tag.leave{background:#4a3a5c;color:#d9b8ff} .tag.bank{background:#2f4a2a;color:#b6e3a5} .tag.spill{background:#5c2c2c;color:#f39c9c} .tag.mine{background:#3a3852;color:var(--ink-2)} .tag.win{background:var(--accent);color:#101018}
  .keys { font-size:12px; color:var(--ink-2); display:grid; grid-template-columns:auto 1fr; gap:4px 10px; }
  kbd { font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--panel-2); border:1px solid var(--rule); border-radius:3px; padding:0 5px; }
  .status { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .status b { color:var(--accent); font-weight:500; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ungroup <span>play</span></h1>
    <div class="meta" id="meta">connecting…</div>
  </header>
  <div class="stage">
    <canvas id="c" width="900" height="900" aria-label="Ungroup arena"></canvas>
    <div class="banner" id="banner" hidden></div>
  </div>
  <aside>
    <div class="card"><h2>Controls</h2>
      <div class="keys">
        <span><kbd>←↑→↓</kbd> / <kbd>WASD</kbd></span><span>steer (a group moves where its members agree)</span>
        <span><kbd>G</kbd></span><span>toggle joinable: touch another open circle to merge</span>
        <span><kbd>Q</kbd> hold</span><span>leave your group (takes 2 s; release to cancel)</span>
        <span><kbd>E</kbd></span><span>cycle your declared colour (only while solo)</span>
      </div>
      <div class="status" id="status" style="margin-top:8px"></div>
    </div>
    <div class="card plist"><h2>Players</h2><div class="players" id="players"></div></div>
    <div class="card feed"><h2>Events</h2><ul id="feed"></ul></div>
  </aside>
</div>
<script>
(function () {
  const RES = ['#9fe0f6', '#f3e59a', '#f3b59b', '#f39c9c'];
  const RESN = ['A', 'B', 'C', 'D'];
  const PC = ['#6ef0c5', '#b28dff', '#4fd1ff', '#ff7bd5', '#f5f5f5', '#9cff57', '#ff6b6b', '#c8b6ff', '#ffd166', '#06d6a0', '#ef476f', '#118ab2', '#f78c6b', '#a8dadc', '#e0aaff', '#80ed99', '#ffb4a2', '#90e0ef', '#c9184a', '#b5e48c', '#fdffb6', '#9bf6ff', '#ffc6ff', '#bdb2ff'];
  const pcolor = i => PC[i % PC.length];
  const params = new URLSearchParams(location.search);
  const wsUrl = params.get('ws') || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':8765');
  const RENDER_DELAY = 0.2;  // seconds behind the newest snapshot

  let meta = null, seat = -1, frames = [], lastRecv = 0, ended = null;
  let cfg = null, names = [];
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const feedEl = document.getElementById('feed'), playersEl = document.getElementById('players');
  const banner = document.getElementById('banner'), statusEl = document.getElementById('status'), metaEl = document.getElementById('meta');
  let cards = [];
  const flashes = [];

  function describe(e) {
    const nm = i => names[i];
    switch (e.kind) {
      case 'merge': return { tag: 'merge', text: `${e.a.map(nm).join(' + ')} joined ${e.b.map(nm).join(' + ')} (group of ${e.size})` };
      case 'leave_start': return { tag: 'leave', text: `${nm(e.player)} starts leaving` };
      case 'leave_cancel': return { tag: 'leave', text: `${nm(e.player)} stays after all` };
      case 'leave': return { tag: 'leave', text: `${nm(e.player)} left with ${e.share.reduce((a, b) => a + b, 0).toFixed(1)} units` };
      case 'bank': return { tag: 'bank', text: `${nm(e.player)} banked ${e.amount.reduce((a, b) => a + b, 0).toFixed(1)}` + (e.group.length > 1 ? ` (group of ${e.group.length})` : '') };
      case 'spill': if (!e.units) return null; return { tag: 'spill', text: `${e.a.map(nm).join('+')} hit ${e.b.map(nm).join('+')}: ${e.units} units spilled` };
      case 'mine_dead': return { tag: 'mine', text: `Mine ${e.mine} (${RESN[meta.mine_type[e.mine]]}) swallowed by the edge` };
      case 'win': return { tag: 'win', text: `${nm(e.player)} wins`, big: true };
      case 'timeout': return { tag: 'win', text: `Time limit: ${nm(e.player)} leads and wins`, big: true };
    }
    return null;
  }

  function padPos(fr, i) { const r = Math.max(fr.R - cfg.pad_radius - 0.02, 0.1); return [r * Math.cos(meta.pads[i]), r * Math.sin(meta.pads[i])]; }
  function bodyOf(f, i) { return f.bodies.find(b => b.m.includes(i)); }
  function key(m) { return m.slice().sort((a, b) => a - b).join(','); }

  function buildCards() {
    playersEl.innerHTML = ''; cards = [];
    for (let i = 0; i < names.length; i++) {
      const el = document.createElement('div');
      el.className = 'player' + (i === seat ? ' me' : '');
      el.innerHTML = `<div class="sw" style="background:${pcolor(i)}"></div><div class="name">${names[i]}${i === seat ? ' (you)' : ''}</div><div class="state"></div>
        <div class="bars">${RES.map(c => `<div class="bar"><div class="carry" style="background:${c}"></div><div class="fill" style="background:${c}"></div></div>`).join('')}</div>
        <div class="nums">${[0, 1, 2, 3].map(() => '<span></span>').join('')}</div>`;
      playersEl.appendChild(el);
      cards.push({ el, state: el.querySelector('.state'), fills: el.querySelectorAll('.fill'), carries: el.querySelectorAll('.carry'), nums: el.querySelectorAll('.nums span') });
    }
  }

  function updateCards(fr) {
    for (let i = 0; i < names.length; i++) {
      const p = fr.players[i], b = bodyOf(fr, i), c = cards[i], need = meta.needs[i];
      const hidden = i !== seat;  // other players' needs are private
      for (let t = 0; t < 4; t++) {
        const banked = Math.min(1, p.banked[t] / need[t]);
        const carry = b ? Math.min(1 - banked, (b.pool[t] / b.m.length) / need[t]) : 0;
        c.fills[t].style.width = (banked * 100).toFixed(1) + '%';
        c.carries[t].style.left = (banked * 100).toFixed(1) + '%';
        c.carries[t].style.width = (carry * 100).toFixed(1) + '%';
        c.nums[t].textContent = hidden ? `${p.banked[t].toFixed(0)}` : `${p.banked[t].toFixed(0)}/${need[t]}`;
      }
      let st = b && b.m.length > 1 ? `group ${b.m.length}` : 'solo';
      if (p.leaving >= 0) st += ' · leaving'; else if (p.cd > 0) st += ' · cooldown'; else if (p.join) st += ' · open';
      const tot = b ? b.pool.reduce((a, x) => a + x, 0) : 0;
      if (tot > 0.5) st += ` · carry ${tot.toFixed(0)}`;
      c.state.textContent = st;
    }
  }

  function addEvents(fr) {
    for (const e of fr.events) {
      const d = describe(e); if (!d) continue;
      const li = document.createElement('li'); if (d.big) li.className = 'big';
      li.innerHTML = `<span class="t">${e.t.toFixed(0)}s</span><span><span class="tag ${d.tag}">${d.tag}</span>${d.text}</span>`;
      feedEl.appendChild(li);
      while (feedEl.children.length > 60) feedEl.removeChild(feedEl.firstChild);
      if (e.kind === 'spill') flashes.push({ x: e.x, y: e.y, t0: e.t, kind: 'spill' });
      if (e.kind === 'bank') { const p = padPos(fr, e.player); flashes.push({ x: p[0], y: p[1], t0: e.t, kind: 'bank', color: pcolor(e.player) }); }
      if (e.kind === 'merge') { const b = bodyOf(fr, e.a[0]); if (b) flashes.push({ x: b.x, y: b.y, t0: e.t, kind: 'merge' }); }
    }
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  function draw() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== W * devicePixelRatio || canvas.height !== H * devicePixelRatio) { canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio; }
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!meta || frames.length === 0) return;
    const S = Math.min(W, H) * 0.47, cx = W / 2, cy = H / 2;
    const X = x => cx + x * S, Y = y => cy + y * S;
    // render time: newest snapshot time minus delay, advanced by wall clock since it arrived
    const newest = frames[frames.length - 1];
    const wall = (performance.now() - lastRecv) / 1000;
    const time = Math.max(frames[0].t, newest.t - RENDER_DELAY + Math.min(wall, RENDER_DELAY));
    let i = frames.length - 1;
    while (i > 0 && frames[i].t > time) i--;
    const fr = frames[i], nx = frames[Math.min(frames.length - 1, i + 1)];
    const span = Math.max(1e-3, nx.t - fr.t);
    const a = Math.min(1, Math.max(0, (time - fr.t) / span));

    ctx.fillStyle = '#222034'; ctx.beginPath(); ctx.arc(cx, cy, fr.R * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#4a4766'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, fr.R * S, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#2b2940'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(cx, cy, S, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    for (let k = 0; k < names.length; k++) {
      const p = padPos(fr, k);
      ctx.fillStyle = pcolor(k); ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), cfg.pad_radius * S, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      if (k === seat) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = '#1b1928'; ctx.font = `600 ${Math.max(9, 0.05 * S)}px "Chakra Petch", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(k), X(p[0]), Y(p[1]) + 1);
    }
    for (let m = 0; m < meta.mine_pos.length; m++) {
      const [mx, my] = meta.mine_pos[m], alive = fr.alive[m], stock = fr.mines[m] / cfg.mine_cap, col = RES[meta.mine_type[m]];
      ctx.beginPath(); ctx.arc(X(mx), Y(my), cfg.mine_radius * S, 0, Math.PI * 2); ctx.fillStyle = alive ? '#2f2d45' : '#1e1c2c'; ctx.fill();
      ctx.strokeStyle = alive ? col : '#3a3852'; ctx.lineWidth = 2; ctx.stroke();
      if (alive) { ctx.beginPath(); ctx.arc(X(mx), Y(my), cfg.mine_radius * S * Math.sqrt(stock) * 0.9, 0, Math.PI * 2); ctx.fillStyle = col; ctx.globalAlpha = 0.8; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.fillStyle = alive ? '#1b1928' : '#3a3852'; ctx.font = `600 ${Math.max(9, 0.045 * S)}px "Chakra Petch", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(RESN[meta.mine_type[m]], X(mx), Y(my) + 1);
    }
    for (const [px, py, tp] of fr.picks) { ctx.fillStyle = RES[tp]; ctx.beginPath(); ctx.arc(X(px), Y(py), 0.012 * S, 0, Math.PI * 2); ctx.fill(); }
    const nextByKey = {}; nx.bodies.forEach(b => { nextByKey[key(b.m)] = b; });
    for (const b of fr.bodies) {
      const nb = nextByKey[key(b.m)];
      const bx = nb ? b.x + (nb.x - b.x) * a : b.x, by = nb ? b.y + (nb.y - b.y) * a : b.y;
      const n = b.m.length, r = cfg.solo_radius * Math.sqrt(n) * S, px = X(bx), py = Y(by);
      const members = b.m.slice().sort((u, v) => u - v);
      const slice = Math.PI * 2 / n;
      members.forEach((k, j) => {
        ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, r, j * slice - Math.PI / 2, (j + 1) * slice - Math.PI / 2); ctx.closePath();
        ctx.fillStyle = pcolor(k); ctx.globalAlpha = fr.players[k].leaving >= 0 ? 0.45 + 0.4 * Math.abs(Math.sin(time * 8)) : 0.9; ctx.fill(); ctx.globalAlpha = 1;
      });
      ctx.strokeStyle = members.includes(seat) ? '#ffffff' : '#101018'; ctx.lineWidth = members.includes(seat) ? 2.5 : 1.5; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.stroke();
      if (b.stun > 0) { ctx.strokeStyle = '#f39c9c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, r + 5, 0, Math.PI * 2 * Math.min(1, b.stun / cfg.stun_time)); ctx.stroke(); }
      if (members.every(k => fr.players[k].join && fr.players[k].cd <= 0)) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(px, py, r + 3, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      members.forEach(k => { const d = fr.players[k].dir; if (Math.abs(d[0]) + Math.abs(d[1]) < 0.01) return; ctx.strokeStyle = pcolor(k); ctx.lineWidth = 2; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + d[0] * (r + 8), py + d[1] * (r + 8)); ctx.stroke(); ctx.globalAlpha = 1; });
      const total = b.pool.reduce((s, x) => s + x, 0);
      if (total > 0.5) { const w = Math.max(r * 1.6, 18), h = 4; let x0 = px - w / 2, y0 = py + r + 5; ctx.fillStyle = '#101018'; ctx.fillRect(x0 - 1, y0 - 1, w + 2, h + 2); const sc = w / Math.max(total, 20); for (let t = 0; t < 4; t++) { const ww = b.pool[t] * sc; ctx.fillStyle = RES[t]; ctx.fillRect(x0, y0, ww, h); x0 += ww; } }
      members.forEach((k, j) => { const ang = (j + 0.5) * slice - Math.PI / 2; ctx.fillStyle = RES[fr.players[k].intent]; ctx.beginPath(); ctx.arc(px + Math.cos(ang) * r * 0.55, py + Math.sin(ang) * r * 0.55, Math.max(2, r * 0.16), 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#101018'; ctx.lineWidth = 1; ctx.stroke(); });
    }
    for (let k = flashes.length - 1; k >= 0; k--) {
      const f = flashes[k], age = time - f.t0;
      if (age > 0.8 || age < -2) { flashes.splice(k, 1); continue; }
      if (age < 0) continue;
      const p = age / 0.8; ctx.globalAlpha = 1 - p; ctx.lineWidth = 2; ctx.strokeStyle = f.kind === 'spill' ? '#f39c9c' : f.kind === 'bank' ? f.color : '#9fe0f6';
      ctx.beginPath(); ctx.arc(X(f.x), Y(f.y), (0.03 + 0.12 * p) * S, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#7f7b98'; ctx.font = `500 ${Math.max(11, 0.05 * S)}px "IBM Plex Mono", monospace`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`${Math.max(0, cfg.time_limit - time).toFixed(0)} s left`, 12, 10);
    updateCards(fr);
  }

  // ---------------------------------------------------------------- input
  const keys = {};
  let joinable = false, leaving = false, intentReq = 0, lastSent = 0, ws = null;
  function sendInput(force) {
    if (!ws || ws.readyState !== 1 || seat < 0) return;
    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1; if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1; if (keys.ArrowDown || keys.KeyS) dy += 1;
    const n = Math.hypot(dx, dy); if (n > 0) { dx /= n; dy /= n; }
    const msg = { type: 'input', dx, dy, join: joinable, leave: leaving, intent: intentReq };
    const s = JSON.stringify(msg);
    if (force || s !== lastSent) { ws.send(s); lastSent = s; intentReq = 0; }
  }
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    keys[e.code] = true;
    if (e.code === 'KeyG') joinable = !joinable;
    if (e.code === 'KeyQ') leaving = true;
    if (e.code === 'KeyE') { const fr = frames[frames.length - 1]; const cur = fr && seat >= 0 ? fr.players[seat].intent : 0; intentReq = ((cur + 1) % 4) + 1; }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    sendInput(true); updateStatus();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'KeyQ') leaving = false; sendInput(true); updateStatus(); });
  setInterval(() => sendInput(true), 250);
  function updateStatus() { statusEl.innerHTML = seat < 0 ? 'spectating' : `you are <b>${names[seat] || 'seat ' + seat}</b> · joinable <b>${joinable ? 'ON' : 'off'}</b>${leaving ? ' · <b>leaving…</b>' : ''}`; }

  // ---------------------------------------------------------------- network
  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { metaEl.textContent = 'connected to ' + wsUrl; };
    ws.onclose = () => { metaEl.textContent = 'disconnected, retrying…'; setTimeout(connect, 2000); };
    ws.onmessage = ev => {
      const d = JSON.parse(ev.data);
      if (d.type === 'hello') {
        meta = d; cfg = d.config; seat = d.seat; frames = []; ended = null; banner.hidden = true; feedEl.innerHTML = '';
        names = d.seats.map((s, i) => s === 'human' ? `Human ${i}` : s === 'policy' ? `Agent ${i}` : `${s[0].toUpperCase() + s.slice(1)} bot ${i}`);
        buildCards(); updateStatus();
        metaEl.textContent = `round ${d.round} · ${d.seats.length} seats · you are seat ${seat}`;
        joinable = false; leaving = false;
      } else if (d.type === 'frame') {
        frames.push(d); lastRecv = performance.now();
        while (frames.length > 40) frames.shift();
        addEvents(d);
      } else if (d.type === 'end') {
        ended = d;
        banner.hidden = false;
        banner.innerHTML = `${names[d.winner]} wins${d.timeout ? ' on time' : ''}<small>next round in a few seconds</small>`;
      } else if (d.type === 'full') {
        metaEl.textContent = 'room is full';
      }
    };
  }
  connect();
  (function loop() { draw(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
